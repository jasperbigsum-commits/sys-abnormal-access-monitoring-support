spring:
  datasource:
    dynamic:
      druid:
        # 连接池的配置信息
        # 初始化大小，最小，最大
        initial-size: 5
        min-idle: 5
        maxActive: 1000
        # 配置获取连接等待超时的时间
        maxWait: 60000
        # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        timeBetweenEvictionRunsMillis: 60000
        maxEvictableIdleTimeMillis: 500000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        minEvictableIdleTimeMillis: 300000
        validationQuery: SELECT 1
        testWhileIdle: true
        testOnBorrow: false
        testOnReturn: false
        # 打开PSCache，并且指定每个连接上PSCache的大小
        poolPreparedStatements: true
        maxPoolPreparedStatementPerConnectionSize: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        filters: stat,slf4j
        # 打开mergeSql功能；慢SQL记录
        stat:
          merge-sql: false
          slow-sql-millis: 5000
      datasource:
        master:
          url: jdbc:h2:mem:audit-spring2-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=0
          username: sa
          password:
          driver-class-name: org.h2.Driver
          type: com.alibaba.druid.pool.DruidDataSource

abnormal:
  access:
    monitor:
      system-id: audit-spring2-web # 本审计示例的稳定系统标识
      mode: ENFORCE # 演示规则命中后调用 @ControlTrigger 方法
      frontend:
        enabled: false # 不接收浏览器补充信号；服务端埋点仍生效
      instrumentation:
        enabled: true # 自动拦截 MVC 方法上的 @MonitorAction
      authentication:
        enabled: true
        subject-key: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
        control-failure-policy: OBSERVE_ONLY
      trusted-proxies: [127.0.0.1/32, "::1/128"] # 验收宿主把本地测试客户端视为显式可信代理
